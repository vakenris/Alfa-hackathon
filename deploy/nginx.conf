# =============================================================================
# Nginx reverse-proxy — Alfa Business News Analytics
# =============================================================================
# Topology:  Client → Nginx :80 → FastAPI backend :8000
#
# Features:
#   - Upstream keepalive pool
#   - Gzip compression for JSON/text responses
#   - SSE proxying with buffering disabled (jobs stream + feed stream)
#   - Rate limiting: 60 req/min per IP for API, 10 req/min for /docs
#   - Security headers (XSS, clickjacking, sniff protection)
#   - 10 MB body limit (analytical uploads up to 50 MB via /api/v1/jobs)
#   - Blocks .env / .log / .db / hidden files
# =============================================================================

# ---- Worker tuning ----------------------------------------------------------
worker_processes  auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 1024;
    multi_accept       on;
    use                epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Performance ---------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # --- Logging format ------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time ut=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # --- Gzip ----------------------------------------------------------------
    gzip              on;
    gzip_min_length   256;
    gzip_comp_level   4;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css
        text/xml
        text/javascript;

    # ---- Rate-limit zones ---------------------------------------------------
    # api:  60 req/min per IP — main API traffic
    # docs: 10 req/min per IP — Swagger/ReDoc UI
    limit_req_zone  $binary_remote_addr  zone=api:10m   rate=60r/m;
    limit_req_zone  $binary_remote_addr  zone=docs:1m   rate=10r/m;

    # ---- Upstream pool ------------------------------------------------------
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # =========================================================================
    # Main server block
    # =========================================================================
    server {
        listen 80;
        server_name _;           # catch-all; set real domain in production

        # --- Global body limit -----------------------------------------------
        client_max_body_size 10m;
        client_body_timeout  30s;
        send_timeout         60s;
        proxy_connect_timeout 10s;

        # --- Security headers ------------------------------------------------
        add_header X-Frame-Options        "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"      always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin" always;
        # Enable when TLS is configured:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # --- Hide nginx version ----------------------------------------------
        server_tokens off;

        # =====================================================================
        # SSE endpoints — buffering MUST be disabled
        # Covers:
        #   /api/v1/streams/jobs/{id}    — agent trace stream
        #   /api/v1/streams/feed/{id}    — live feed updates
        #   /api/v1/jobs/{id}/stream     — backward-compatible alias
        # =====================================================================
        location ~* ^/api/v1/(streams/|jobs/[^/]+/stream) {
            limit_req zone=api burst=10 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;

            # SSE-critical: disable all buffering
            proxy_buffering            off;
            proxy_cache                off;
            proxy_read_timeout         3600s;  # up to 1 h per SSE connection
            proxy_send_timeout         3600s;
            chunked_transfer_encoding  off;

            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;
            proxy_set_header  Connection        "";  # required for HTTP/1.1 keepalive
            proxy_pass_request_headers on;
        }

        # =====================================================================
        # Insight job trigger — allow larger body for future file uploads
        # =====================================================================
        location = /api/v1/insights {
            limit_req zone=api burst=5 nodelay;
            client_max_body_size 50m;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_read_timeout 180s;

            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;
            proxy_set_header  Connection        "";
            proxy_pass_request_headers on;
        }

        # =====================================================================
        # Health probes — no rate limit, no access log
        # =====================================================================
        location = /api/v1/health/live {
            access_log off;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   Connection "";
        }

        location = /api/v1/health/ready {
            access_log off;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   Connection "";
        }

        # =====================================================================
        # API Docs — stricter rate limit
        # =====================================================================
        location ~ ^/(docs|redoc|openapi\.json)$ {
            limit_req zone=docs burst=3 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";
        }

        # =====================================================================
        # All other API routes
        # =====================================================================
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;

            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;
            proxy_set_header  Connection        "";
            proxy_pass_request_headers on;
        }

        # =====================================================================
        # Root
        # =====================================================================
        root /usr/share/nginx/html;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }

        # =====================================================================
        # Security: block hidden files and sensitive extensions
        # =====================================================================
        location ~ /\. {
            deny  all;
            return 404;
        }

        location ~* \.(env|log|sql|db|bak|cfg|ini)$ {
            deny  all;
            return 404;
        }
    }
}
