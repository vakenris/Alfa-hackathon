version: '3.8'

# =============================================================================
# Alfa Business News Analytics — Docker Compose
# =============================================================================
# Services:
#   postgres  — PostgreSQL 16 + pgvector (via init.sql)
#   redis     — Redis 7 (pub/sub event bus + job queue)
#   backend   — FastAPI application (uvicorn)
#   nginx     — Reverse proxy (port 80 → backend:8000)
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up --build
#
# Environment overrides:
#   Copy .env.example → .env and fill in AGENT_LLM_* values.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16   # official pgvector image with pg16
    container_name: alfa_postgres
    restart: always
    environment:
      POSTGRES_DB:       alfa_analytics
      POSTGRES_USER:     alfa_user
      POSTGRES_PASSWORD: alfa_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init.sql runs once on first start (empty data volume)
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa_user -d alfa_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: alfa_redis
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: alfa_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://alfa_user:alfa_password@postgres:5432/alfa_analytics

      # Redis event bus
      REDIS_URL:          redis://redis:6379/0
      USE_IN_MEMORY_BUS:  "false"

      # Server
      HOST: "0.0.0.0"
      PORT: "8000"

      # LLM Agent (fill real values in .env or via CI secrets)
      # AGENT_LLM_API_URL:      https://llm-gateway.example.com/v1/chat/completions
      # AGENT_LLM_MODEL:        gemma-3-27b-it
      # AGENT_LLM_AUTH_HEADER:  Authorization
      # AGENT_LLM_AUTH_VALUE:   Bearer <your-key>
      # AGENT_LLM_TIMEOUT_SECONDS: "60"
      # AGENT_LLM_MAX_OUTPUT_TOKENS: "2048"

    # Backend is NOT exposed directly — only via nginx
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Nginx reverse proxy
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: alfa_nginx
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t 2>/dev/null && wget -qO- http://localhost/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  postgres_data:
